<style>
.editor-toggle{
position:fixed;
bottom:100px;
right:20px;
z-index:99999;
background:#000;
color:#fff;
border:none;
padding:16px 18px;
border-radius:50px;
font-weight:700;
font-size:14px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
cursor:pointer;
}
.editor-panel{
position:fixed;
top:0;
right:-100%;
width:100%;
max-width:420px;
height:100vh;
background:#fff;
z-index:999999;
overflow:auto;
padding:25px;
transition:.4s ease;
box-shadow:-10px 0 40px rgba(0,0,0,.15);
}
.editor-panel.active{
right:0;
}
.editor-panel h2{
font-size:24px;
margin-bottom:20px;
}
.editor-panel label{
display:block;
font-size:13px;
font-weight:700;
margin-top:18px;
margin-bottom:8px;
}
.editor-panel input,
.editor-panel textarea{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
font-family:inherit;
font-size:14px;
}
.editor-panel textarea{
min-height:120px;
resize:none;
}
.editor-panel button{
width:100%;
margin-top:20px;
padding:16px;
border:none;
border-radius:14px;
font-weight:700;
cursor:pointer;
font-size:15px;
}
.save-btn{
background:#000;
color:#fff;
}
.close-btn{
background:#f5f5f5;
color:#111;
}
</style>
<button class="editor-toggle" onclick="openEditor()">
⚙️ EDITAR LANDING
</button>
<div class="editor-panel" id="editorPanel">
<h2>Editar Landing</h2>
<label>Nombre tienda</label>
<input type="text" id="editStoreName">
<label>Nombre producto</label>
<input type="text" id="editProductTitle">
<label>Precio</label>
<input type="text" id="editPrice">
<label>Precio anterior</label>
<input type="text" id="editOldPrice">
<label>Texto descuento</label>
<input type="text" id="editDiscount">
<label>Descripción</label>
<textarea id="editDescription"></textarea>
<label>Imagen principal URL</label>
<input type="text" id="editMainImage">
<button class="save-btn" onclick="saveLandingChanges()">
GUARDAR CAMBIOS
</button>
<button class="close-btn" onclick="closeEditor()">
CERRAR
</button>
</div>
<script>
function openEditor(){
document.getElementById("editorPanel").classList.add("active");
}
function closeEditor(){
document.getElementById("editorPanel").classList.remove("active");
}
function saveLandingChanges(){
const store =
document.getElementById("editStoreName").value;
const title =
document.getElementById("editProductTitle").value;
const price =
document.getElementById("editPrice").value;
const oldPrice =
document.getElementById("editOldPrice").value;
const discount =
document.getElementById("editDiscount").value;
const desc =
document.getElementById("editDescription").value;
const image =
document.getElementById("editMainImage").value;
if(store){
const storeName =
document.getElementById("storeName");
if(storeName){
storeName.innerText = store;
}
}
if(title){
const productTitle =
document.getElementById("productTitle");
if(productTitle){
productTitle.innerText = title;
}
document.title = title;
}
if(price){
const productPrice =
document.getElementById("productPrice");
if(productPrice){
productPrice.innerText = price;
}
}
if(oldPrice){
const oldPriceElement =
document.getElementById("oldPrice");
if(oldPriceElement){
oldPriceElement.innerText = oldPrice;
}
}
if(discount){
const discountElement =
document.getElementById("discountText");
if(discountElement){
discountElement.innerText = discount;
}
}
if(desc){
const descElement =
document.getElementById("descText");
if(descElement){
descElement.innerText = desc;
}
}
if(image){
const mainImage =
document.getElementById("mainProductImage");
if(mainImage){
mainImage.src = image;
}
}
alert("✅ Landing actualizada correctamente");
}
</script>
